<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Server - Discord Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: #1e1e2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 95vh;
            max-height: 820px;
            background: #2b2d3e;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            background: #1e1e2e;
            padding: 16px 20px;
            border-bottom: 1px solid #3a3c4e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header h1 {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header h1 span {
            background: #5865f2;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 30px;
            color: white;
            font-weight: 500;
        }

        .user-count {
            color: #a6a9c2;
            font-size: 14px;
            background: #2b2d3e;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #3a3c4e;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #232533;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #5865f2;
            border-radius: 10px;
        }

        .message {
            background: #2b2d3e;
            padding: 10px 14px;
            border-radius: 16px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
            border: 1px solid #3a3c4e;
            align-self: flex-start;
        }

        .message.own {
            align-self: flex-end;
            background: #5865f2;
            border-color: #5865f2;
        }

        .message .msg-user {
            font-size: 13px;
            font-weight: 600;
            color: #b9bbe7;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message.own .msg-user {
            color: #d4d6f0;
        }

        .message .msg-user .badge {
            background: #3a3c4e;
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 30px;
            color: #a6a9c2;
            font-weight: 400;
        }

        .message.own .msg-user .badge {
            background: #4752c4;
            color: #d4d6f0;
        }

        .message .msg-text {
            color: #e4e6f0;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message .msg-time {
            font-size: 10px;
            color: #6d6f87;
            margin-top: 4px;
            text-align: right;
        }

        .message.own .msg-time {
            color: #b9bbd4;
        }

        .system-msg {
            text-align: center;
            font-size: 12px;
            color: #6d6f87;
            padding: 6px 0;
            background: transparent;
            border: none;
            align-self: center;
        }

        .system-msg.server {
            color: #5865f2;
            font-weight: 600;
        }

        .system-msg.error {
            color: #f44336;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            background: #1e1e2e;
            padding: 12px 16px 16px;
            border-top: 1px solid #3a3c4e;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            background: #2b2d3e;
            border: 1px solid #3a3c4e;
            border-radius: 30px;
            padding: 12px 18px;
            color: #e4e6f0;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-area input:focus {
            border-color: #5865f2;
            background: #2f3145;
        }

        .input-area input::placeholder {
            color: #6d6f87;
        }

        .input-area input:disabled {
            opacity: 0.5;
        }

        .input-area button {
            background: #5865f2;
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .input-area button:active {
            transform: scale(0.92);
            background: #4752c4;
        }

        .input-area button:disabled {
            opacity: 0.5;
            transform: scale(1);
            cursor: not-allowed;
        }

        .status-bar {
            background: #1e1e2e;
            padding: 6px 16px;
            font-size: 11px;
            color: #6d6f87;
            text-align: center;
            border-top: 1px solid #2b2d3e;
            display: flex;
            justify-content: space-between;
        }

        .status-bar .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }

        .status-bar .status-dot.offline {
            background: #f44336;
            animation: none;
        }

        .status-bar .status-dot.connecting {
            background: #ff9800;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        @media (max-width: 480px) {
            .chat-container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
            .chat-header h1 {
                font-size: 16px;
            }
        }

        .server-badge {
            background: #5865f2;
            color: white;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 8px;
        }

        .reconnect-btn {
            background: #2b2d3e;
            color: #a6a9c2;
            border: 1px solid #3a3c4e;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }

        .reconnect-btn:hover {
            background: #3a3c4e;
        }

        .reconnect-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="chat-container" id="app">
    <div class="chat-header">
        <h1>
            💬 Chat
            <span>Beta</span>
        </h1>
        <div class="user-count" id="userCount">👥 0</div>
    </div>

    <div class="messages" id="messagesContainer">
        <div class="system-msg">🔄 Iniciando...</div>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Digite sua mensagem..." maxlength="500" autocomplete="off" disabled>
        <button id="sendBtn" aria-label="Enviar" disabled>➤</button>
    </div>

    <div class="status-bar">
        <span><span class="status-dot" id="statusDot"></span> <span id="statusText">Iniciando...</span></span>
        <span id="connectionStatus">Desconectado</span>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script>
    (function() {
        'use strict';

        // CONFIGURAÇÃO
        const SERVER_ID = 'discord-chat-master-server';
        const RECONNECT_DELAY = 3000;
        const ELECTION_DELAY = 5000;
        
        // Elementos
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const userCountSpan = document.getElementById('userCount');
        const connectionStatusSpan = document.getElementById('connectionStatus');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // Estado
        let currentUsername = 'User' + Math.floor(Math.random() * 10000);
        let peer = null;
        let serverConnection = null;
        let isServer = false;
        let isConnected = false;
        let messageHistory = [];
        let reconnectTimer = null;
        let electionTimer = null;
        let isElectionRunning = false;
        let myPeerId = '';
        let clients = {};
        let lastPing = Date.now();

        // Funções auxiliares
        function getCurrentTime() {
            return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function addMessageToDOM(username, text, isOwn = false, system = false, isServerMsg = false, isError = false) {
            const msgDiv = document.createElement('div');
            
            if (system) {
                msgDiv.className = 'system-msg';
                if (isServerMsg) msgDiv.classList.add('server');
                if (isError) msgDiv.classList.add('error');
                msgDiv.textContent = text;
            } else {
                msgDiv.className = 'message' + (isOwn ? ' own' : '');
                
                const userDiv = document.createElement('div');
                userDiv.className = 'msg-user';
                userDiv.innerHTML = `${username} <span class="badge">${isOwn ? 'Você' : 'Online'}</span>`;
                
                const textDiv = document.createElement('div');
                textDiv.className = 'msg-text';
                textDiv.textContent = text;
                
                const timeDiv = document.createElement('div');
                timeDiv.className = 'msg-time';
                timeDiv.textContent = getCurrentTime();
                
                msgDiv.appendChild(userDiv);
                msgDiv.appendChild(textDiv);
                msgDiv.appendChild(timeDiv);
            }
            
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showSystemMessage(text, isServerMsg = false, isError = false) {
            addMessageToDOM('', text, false, true, isServerMsg, isError);
        }

        function updateStatus(text, state = 'online') {
            statusText.textContent = text;
            statusDot.className = 'status-dot';
            if (state === 'offline') statusDot.classList.add('offline');
            if (state === 'connecting') statusDot.classList.add('connecting');
            
            if (isServer) {
                connectionStatusSpan.textContent = '👑 Servidor';
            } else if (isConnected) {
                connectionStatusSpan.textContent = '✅ Conectado';
            } else {
                connectionStatusSpan.textContent = '❌ Desconectado';
            }
        }

        function updateUserCount(count) {
            userCountSpan.textContent = `👥 ${count || 0}`;
        }

        function setInputEnabled(enabled) {
            messageInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            if (enabled) {
                messageInput.focus();
            }
        }

        // Enviar mensagem
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !isConnected) {
                if (!isConnected) showSystemMessage('⚠️ Aguarde a conexão...', false, true);
                return;
            }

            // Mostra localmente
            addMessageToDOM(currentUsername, text, true);
            messageHistory.push({ username: currentUsername, text, time: Date.now() });

            // Envia para todos
            broadcastMessage({
                type: 'message',
                username: currentUsername,
                text: text,
                time: Date.now()
            });

            messageInput.value = '';
            messageInput.focus();
        }

        // Transmitir mensagem
        function broadcastMessage(data, excludeConn = null) {
            if (isServer) {
                // Servidor envia para todos os clientes
                Object.keys(clients).forEach(peerId => {
                    const conn = clients[peerId];
                    if (conn && conn !== excludeConn && conn.open) {
                        try {
                            conn.send(data);
                        } catch (e) {
                            console.warn('Erro ao enviar para', peerId, e);
                        }
                    }
                });
            } else if (serverConnection && serverConnection.open) {
                // Cliente envia para o servidor
                try {
                    serverConnection.send(data);
                } catch (e) {
                    console.warn('Erro ao enviar para servidor', e);
                }
            }
        }

        // INICIAR COMO SERVIDOR
        function startAsServer() {
            if (isServer) return;
            
            // Limpa qualquer estado anterior
            cleanup();
            
            isServer = true;
            isConnected = true;
            isElectionRunning = false;
            clients = {};
            
            updateStatus('👑 Servidor ativo', 'online');
            showSystemMessage('✅ Você é o servidor!', true);
            setInputEnabled(true);
            
            peer = new Peer(SERVER_ID, {
                debug: 0,
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                myPeerId = id;
                console.log('Servidor iniciado:', id);
                showSystemMessage(`🟢 Servidor pronto! ID: ${SERVER_ID}`, true);
                updateUserCount(0);
            });

            peer.on('connection', (conn) => {
                console.log('Nova conexão recebida:', conn.peer);
                
                // Armazena a conexão
                clients[conn.peer] = conn;
                
                conn.on('open', () => {
                    showSystemMessage(`👤 ${conn.peer} entrou no chat`);
                    updateUserCount(Object.keys(clients).length);
                    
                    // Envia histórico
                    messageHistory.forEach(msg => {
                        conn.send({
                            type: 'history',
                            username: msg.username,
                            text: msg.text,
                            time: msg.time
                        });
                    });
                    
                    // Anuncia para todos
                    broadcastMessage({
                        type: 'system',
                        text: `${conn.peer} entrou no chat`
                    }, conn);
                });

                conn.on('data', (data) => {
                    handleServerData(data, conn);
                });

                conn.on('close', () => {
                    delete clients[conn.peer];
                    showSystemMessage(`👤 ${conn.peer} saiu do chat`);
                    updateUserCount(Object.keys(clients).length);
                    
                    broadcastMessage({
                        type: 'system',
                        text: `${conn.peer} saiu do chat`
                    });
                });

                conn.on('error', (err) => {
                    console.warn('Erro na conexão com cliente:', err);
                    delete clients[conn.peer];
                    updateUserCount(Object.keys(clients).length);
                });
            });

            peer.on('error', (err) => {
                console.error('Erro no servidor:', err);
                if (err.type === 'unavailable-id') {
                    showSystemMessage('⚠️ Outro servidor já está ativo. Conectando como cliente...', false, true);
                    isServer = false;
                    isConnected = false;
                    cleanup();
                    setTimeout(() => connectAsClient(), 1000);
                }
            });
        }

        // CONECTAR COMO CLIENTE
        function connectAsClient() {
            if (isServer) return;
            
            cleanup();
            
            isServer = false;
            isConnected = false;
            isElectionRunning = false;
            
            updateStatus('Conectando...', 'connecting');
            showSystemMessage(`🔗 Tentando conectar ao servidor...`);
            setInputEnabled(false);
            
            peer = new Peer({
                debug: 0,
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                myPeerId = id;
                console.log('Cliente ID:', id);
                
                // Tenta conectar ao servidor
                const conn = peer.connect(SERVER_ID, { reliable: true });
                serverConnection = conn;
                
                conn.on('open', () => {
                    isConnected = true;
                    updateStatus('Conectado', 'online');
                    showSystemMessage('✅ Conectado ao servidor!');
                    setInputEnabled(true);
                    
                    // Envia join
                    conn.send({
                        type: 'join',
                        username: currentUsername
                    });
                });

                conn.on('data', (data) => {
                    handleClientData(data);
                });

                conn.on('close', () => {
                    isConnected = false;
                    serverConnection = null;
                    updateStatus('Desconectado', 'offline');
                    showSystemMessage('⚠️ Servidor caiu! Iniciando eleição...', false, true);
                    setInputEnabled(false);
                    
                    startElection();
                });

                conn.on('error', (err) => {
                    console.warn('Erro de conexão:', err);
                    if (err.type === 'peer-unavailable') {
                        showSystemMessage('⚠️ Servidor não encontrado. Iniciando eleição...', false, true);
                        startElection();
                    } else {
                        isConnected = false;
                        serverConnection = null;
                        updateStatus('Erro', 'offline');
                        setInputEnabled(false);
                    }
                });
            });

            peer.on('error', (err) => {
                console.error('Erro no cliente:', err);
                if (err.type === 'unavailable-id') {
                    // Tenta novamente com outro ID
                    cleanup();
                    setTimeout(() => connectAsClient(), 1000);
                }
            });
        }

        // MANIPULAR DADOS NO SERVIDOR
        function handleServerData(data, conn) {
            if (data.type === 'message') {
                messageHistory.push({ username: data.username, text: data.text, time: data.time });
                addMessageToDOM(data.username, data.text, false);
                broadcastMessage(data, conn);
            } else if (data.type === 'join') {
                showSystemMessage(`👤 ${data.username} entrou no chat`);
                broadcastMessage({ type: 'system', text: `${data.username} entrou no chat` }, conn);
            } else if (data.type === 'ping') {
                conn.send({ type: 'pong' });
            }
        }

        // MANIPULAR DADOS NO CLIENTE
        function handleClientData(data) {
            if (data.type === 'message') {
                addMessageToDOM(data.username, data.text, false);
                messageHistory.push({ username: data.username, text: data.text, time: data.time });
            } else if (data.type === 'history') {
                addMessageToDOM(data.username, data.text, false);
                messageHistory.push({ username: data.username, text: data.text, time: data.time });
            } else if (data.type === 'system') {
                showSystemMessage(data.text);
            } else if (data.type === 'pong') {
                lastPing = Date.now();
            }
        }

        // ELEIÇÃO
        function startElection() {
            if (isElectionRunning || isServer || isConnected) return;
            
            isElectionRunning = true;
            updateStatus('Eleição...', 'connecting');
            showSystemMessage('⚡ Eleição em andamento...', true);
            
            // Aguarda para ver se alguém já virou servidor
            electionTimer = setTimeout(() => {
                if (!isConnected && !isServer) {
                    // Tenta conectar novamente
                    cleanup();
                    
                    // Tenta ser servidor
                    showSystemMessage('🔄 Nenhum servidor encontrado. Você será o servidor!', true);
                    setTimeout(() => {
                        startAsServer();
                    }, 1000);
                }
                isElectionRunning = false;
            }, ELECTION_DELAY);
            
            // Também tenta reconectar algumas vezes
            let attempts = 0;
            const reconnectInterval = setInterval(() => {
                attempts++;
                if (attempts > 3 || isConnected || isServer) {
                    clearInterval(reconnectInterval);
                    return;
                }
                
                if (!isConnected && !isServer) {
                    console.log('Tentando reconectar como cliente...');
                    cleanup();
                    connectAsClient();
                }
            }, 2000);
        }

        // LIMPEZA
        function cleanup() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            if (electionTimer) {
                clearTimeout(electionTimer);
                electionTimer = null;
            }
            
            if (peer) {
                try {
                    peer.destroy();
                } catch (e) {}
                peer = null;
            }
            
            serverConnection = null;
            clients = {};
            isElectionRunning = false;
        }

        // INICIALIZAR
        function init() {
            // Limpa mensagens iniciais
            setTimeout(() => {
                const msgs = messagesContainer.querySelectorAll('.system-msg');
                msgs.forEach(msg => msg.remove());
            }, 1000);
            
            // Primeiro tenta conectar como cliente
            connectAsClient();
            
            // Se não conectar em 5 segundos, inicia eleição
            setTimeout(() => {
                if (!isConnected && !isServer) {
                    startElection();
                }
            }, 5000);
        }

        // EVENT LISTENERS
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // RECONEXÃO AUTOMÁTICA
        setInterval(() => {
            if (!isConnected && !isServer && !isElectionRunning) {
                console.log('Tentando reconectar...');
                cleanup();
                connectAsClient();
            }
        }, 10000);

        // VERIFICAÇÃO DE SAÚDE (clientes)
        setInterval(() => {
            if (!isServer && isConnected && serverConnection) {
                try {
                    serverConnection.send({ type: 'ping' });
                } catch (e) {
                    console.warn('Erro ao enviar ping:', e);
                }
            }
        }, 5000);

        // INICIA
        init();

        console.log('Chat iniciado! ID do servidor:', SERVER_ID);
        console.log('Seu nome:', currentUsername);

    })();
</script>

</body>
</html>
