<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Server - Discord Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: #1e1e2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 95vh;
            max-height: 820px;
            background: #2b2d3e;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            background: #1e1e2e;
            padding: 16px 20px;
            border-bottom: 1px solid #3a3c4e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header h1 {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header h1 span {
            background: #5865f2;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 30px;
            color: white;
            font-weight: 500;
        }

        .user-count {
            color: #a6a9c2;
            font-size: 14px;
            background: #2b2d3e;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #3a3c4e;
        }

        .server-selector {
            background: #1e1e2e;
            padding: 12px 16px;
            border-bottom: 1px solid #3a3c4e;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .server-btn {
            flex: 1;
            min-width: 80px;
            padding: 8px 12px;
            border: 2px solid #3a3c4e;
            border-radius: 20px;
            background: #2b2d3e;
            color: #a6a9c2;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .server-btn:hover {
            border-color: #5865f2;
            color: #fff;
        }

        .server-btn.active {
            border-color: #5865f2;
            background: #5865f2;
            color: white;
        }

        .server-btn .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }

        .server-btn .status-indicator.online {
            background: #4caf50;
        }

        .server-btn .status-indicator.offline {
            background: #f44336;
        }

        .server-btn .status-indicator.creating {
            background: #ff9800;
            animation: pulse 0.5s infinite;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #232533;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #5865f2;
            border-radius: 10px;
        }

        .message {
            background: #2b2d3e;
            padding: 10px 14px;
            border-radius: 16px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
            border: 1px solid #3a3c4e;
            align-self: flex-start;
        }

        .message.own {
            align-self: flex-end;
            background: #5865f2;
            border-color: #5865f2;
        }

        .message .msg-user {
            font-size: 13px;
            font-weight: 600;
            color: #b9bbe7;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message.own .msg-user {
            color: #d4d6f0;
        }

        .message .msg-user .badge {
            background: #3a3c4e;
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 30px;
            color: #a6a9c2;
            font-weight: 400;
        }

        .message.own .msg-user .badge {
            background: #4752c4;
            color: #d4d6f0;
        }

        .message .msg-text {
            color: #e4e6f0;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message .msg-time {
            font-size: 10px;
            color: #6d6f87;
            margin-top: 4px;
            text-align: right;
        }

        .message.own .msg-time {
            color: #b9bbd4;
        }

        /* Áudio message */
        .audio-message {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e1e2e;
            padding: 8px 12px;
            border-radius: 12px;
            margin: 4px 0;
            min-width: 150px;
        }

        .audio-message .play-btn {
            background: #5865f2;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .audio-message .play-btn:hover {
            background: #4752c4;
        }

        .audio-message .play-btn:active {
            transform: scale(0.9);
        }

        .audio-message .audio-progress {
            flex: 1;
            height: 4px;
            background: #3a3c4e;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            min-width: 60px;
        }

        .audio-message .audio-progress .progress-bar {
            height: 100%;
            background: #5865f2;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s;
        }

        .audio-message .audio-time {
            color: #a6a9c2;
            font-size: 11px;
            min-width: 30px;
            text-align: center;
        }

        .audio-message .audio-duration {
            color: #6d6f87;
            font-size: 11px;
        }

        .system-msg {
            text-align: center;
            font-size: 12px;
            color: #6d6f87;
            padding: 6px 0;
            background: transparent;
            border: none;
            align-self: center;
        }

        .system-msg.server {
            color: #5865f2;
            font-weight: 600;
        }

        .system-msg.error {
            color: #f44336;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .input-area {
            background: #1e1e2e;
            padding: 12px 16px 16px;
            border-top: 1px solid #3a3c4e;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .input-area .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .input-area input {
            flex: 1;
            background: #2b2d3e;
            border: 1px solid #3a3c4e;
            border-radius: 30px;
            padding: 12px 18px;
            color: #e4e6f0;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            min-width: 0;
        }

        .input-area input:focus {
            border-color: #5865f2;
            background: #2f3145;
        }

        .input-area input::placeholder {
            color: #6d6f87;
        }

        .input-area input:disabled {
            opacity: 0.5;
        }

        .input-area .action-btn {
            background: #2b2d3e;
            border: 1px solid #3a3c4e;
            color: #a6a9c2;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .input-area .action-btn:hover {
            border-color: #5865f2;
            color: #fff;
        }

        .input-area .action-btn:active {
            transform: scale(0.92);
        }

        .input-area .action-btn.recording {
            background: #f44336;
            border-color: #f44336;
            color: white;
            animation: pulse 0.5s infinite;
        }

        .input-area .action-btn.send-btn {
            background: #5865f2;
            border: none;
            color: white;
        }

        .input-area .action-btn.send-btn:hover {
            background: #4752c4;
        }

        .input-area .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area .recording-timer {
            color: #f44336;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
        }

        .status-bar {
            background: #1e1e2e;
            padding: 6px 16px;
            font-size: 11px;
            color: #6d6f87;
            text-align: center;
            border-top: 1px solid #2b2d3e;
            display: flex;
            justify-content: space-between;
        }

        .status-bar .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }

        .status-bar .status-dot.offline {
            background: #f44336;
            animation: none;
        }

        .status-bar .status-dot.connecting {
            background: #ff9800;
            animation: pulse 0.5s infinite;
        }

        @media (max-width: 480px) {
            .chat-container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
            .chat-header h1 {
                font-size: 16px;
            }
            .server-btn {
                font-size: 11px;
                padding: 6px 10px;
                min-width: 60px;
            }
            .input-area .action-btn {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .input-area input {
                font-size: 14px;
                padding: 10px 14px;
            }
            .audio-message {
                min-width: 120px;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 380px) {
            .input-area .action-btn {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
            .input-area input {
                font-size: 13px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

<div class="chat-container" id="app">
    <div class="chat-header">
        <h1>
            💬 Chat
            <span>Beta</span>
        </h1>
        <div class="user-count" id="userCount">👥 0</div>
    </div>

    <div class="server-selector" id="serverSelector">
        <button class="server-btn" data-server="1" id="server1Btn">
            <span class="status-indicator" id="status1"></span> Servidor 1
        </button>
        <button class="server-btn" data-server="2" id="server2Btn">
            <span class="status-indicator" id="status2"></span> Servidor 2
        </button>
        <button class="server-btn" data-server="3" id="server3Btn">
            <span class="status-indicator" id="status3"></span> Servidor 3
        </button>
    </div>

    <div class="messages" id="messagesContainer">
        <div class="system-msg">🔌 Selecione um servidor para entrar</div>
    </div>

    <div class="input-area">
        <div class="input-row">
            <input type="text" id="messageInput" placeholder="Digite sua mensagem..." maxlength="500" autocomplete="off" disabled>
            <button class="action-btn" id="audioBtn" title="Gravar Áudio (30s)" disabled>🎤</button>
            <button class="action-btn send-btn" id="sendBtn" aria-label="Enviar" disabled>➤</button>
        </div>
        <div class="recording-timer" id="recordingTimer"></div>
    </div>

    <div class="status-bar">
        <span><span class="status-dot" id="statusDot"></span> <span id="statusText">Desconectado</span></span>
        <span id="connectionStatus">Selecione um servidor</span>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script>
    (function() {
        'use strict';

        // SERVIDORES PRÉ-DEFINIDOS
        const SERVERS = {
            1: { id: 'chat-server-1', name: 'Servidor 1' },
            2: { id: 'chat-server-2', name: 'Servidor 2' },
            3: { id: 'chat-server-3', name: 'Servidor 3' }
        };

        // Elementos
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const audioBtn = document.getElementById('audioBtn');
        const recordingTimer = document.getElementById('recordingTimer');
        const userCountSpan = document.getElementById('userCount');
        const connectionStatusSpan = document.getElementById('connectionStatus');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const serverBtns = document.querySelectorAll('.server-btn');
        const statusIndicators = {
            1: document.getElementById('status1'),
            2: document.getElementById('status2'),
            3: document.getElementById('status3')
        };

        // Estado
        let currentUsername = 'User' + Math.floor(Math.random() * 10000);
        let peer = null;
        let serverConnection = null;
        let isServer = false;
        let isConnected = false;
        let currentServer = null;
        let messageHistory = [];
        let clients = {};
        let selectedServerId = null;
        let isCreatingServer = false;

        // Áudio
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingStartTime = null;
        let recordingTimerInterval = null;
        let audioPlayers = {};

        // Funções auxiliares
        function getCurrentTime() {
            return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function addMessageToDOM(username, text, isOwn = false, system = false, isServerMsg = false, isError = false, audioData = null) {
            const msgDiv = document.createElement('div');
            
            if (system) {
                msgDiv.className = 'system-msg';
                if (isServerMsg) msgDiv.classList.add('server');
                if (isError) msgDiv.classList.add('error');
                msgDiv.textContent = text;
            } else {
                msgDiv.className = 'message' + (isOwn ? ' own' : '');
                
                const userDiv = document.createElement('div');
                userDiv.className = 'msg-user';
                userDiv.innerHTML = `${username} <span class="badge">${isOwn ? 'Você' : 'Online'}</span>`;
                
                let contentDiv = document.createElement('div');
                contentDiv.className = 'msg-text';
                
                if (audioData) {
                    // Criar player de áudio
                    const audioContainer = document.createElement('div');
                    audioContainer.className = 'audio-message';
                    
                    const playBtn = document.createElement('button');
                    playBtn.className = 'play-btn';
                    playBtn.textContent = '▶';
                    playBtn.dataset.playing = 'false';
                    
                    const progressContainer = document.createElement('div');
                    progressContainer.className = 'audio-progress';
                    const progressBar = document.createElement('div');
                    progressBar.className = 'progress-bar';
                    progressContainer.appendChild(progressBar);
                    
                    const timeDisplay = document.createElement('span');
                    timeDisplay.className = 'audio-time';
                    timeDisplay.textContent = '0:00';
                    
                    const audio = new Audio(audioData);
                    audio.preload = 'metadata';
                    
                    let isPlaying = false;
                    
                    audio.addEventListener('loadedmetadata', () => {
                        const duration = Math.floor(audio.duration);
                        const minutes = Math.floor(duration / 60);
                        const seconds = duration % 60;
                        timeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                    });
                    
                    playBtn.addEventListener('click', () => {
                        if (isPlaying) {
                            audio.pause();
                            playBtn.textContent = '▶';
                            isPlaying = false;
                            playBtn.dataset.playing = 'false';
                        } else {
                            // Pausar outros áudios
                            document.querySelectorAll('.play-btn').forEach(btn => {
                                if (btn !== playBtn && btn.dataset.playing === 'true') {
                                    btn.click();
                                }
                            });
                            
                            audio.play();
                            playBtn.textContent = '⏸';
                            isPlaying = true;
                            playBtn.dataset.playing = 'true';
                            
                            // Atualizar progresso
                            const updateProgress = () => {
                                if (!isPlaying) return;
                                const progress = (audio.currentTime / audio.duration) * 100;
                                progressBar.style.width = progress + '%';
                                const current = Math.floor(audio.currentTime);
                                const minutes = Math.floor(current / 60);
                                const seconds = current % 60;
                                timeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                                requestAnimationFrame(updateProgress);
                            };
                            updateProgress();
                        }
                    });
                    
                    audio.addEventListener('ended', () => {
                        playBtn.textContent = '▶';
                        isPlaying = false;
                        playBtn.dataset.playing = 'false';
                        progressBar.style.width = '0%';
                        timeDisplay.textContent = '0:00';
                    });
                    
                    // Click no progresso para buscar
                    progressContainer.addEventListener('click', (e) => {
                        const rect = progressContainer.getBoundingClientRect();
                        const x = (e.clientX - rect.left) / rect.width;
                        audio.currentTime = x * audio.duration;
                    });
                    
                    audioContainer.appendChild(playBtn);
                    audioContainer.appendChild(progressContainer);
                    audioContainer.appendChild(timeDisplay);
                    
                    contentDiv.appendChild(audioContainer);
                } else {
                    contentDiv.textContent = text;
                }
                
                const timeDiv = document.createElement('div');
                timeDiv.className = 'msg-time';
                timeDiv.textContent = getCurrentTime();
                
                msgDiv.appendChild(userDiv);
                msgDiv.appendChild(contentDiv);
                msgDiv.appendChild(timeDiv);
            }
            
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showSystemMessage(text, isServerMsg = false, isError = false) {
            addMessageToDOM('', text, false, true, isServerMsg, isError);
        }

        function updateStatus(text, state = 'online') {
            statusText.textContent = text;
            statusDot.className = 'status-dot';
            if (state === 'offline') statusDot.classList.add('offline');
            if (state === 'connecting') statusDot.classList.add('connecting');
            
            if (isServer) {
                connectionStatusSpan.textContent = '👑 Servidor';
            } else if (isConnected) {
                connectionStatusSpan.textContent = `✅ Conectado ao ${currentServer ? SERVERS[currentServer].name : ''}`;
            } else {
                connectionStatusSpan.textContent = '❌ Desconectado';
            }
        }

        function updateUserCount(count) {
            userCountSpan.textContent = `👥 ${count || 0}`;
        }

        function setInputEnabled(enabled) {
            messageInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            audioBtn.disabled = !enabled;
            if (enabled) {
                messageInput.focus();
            }
        }

        function updateServerStatus(serverId, status) {
            const indicator = statusIndicators[serverId];
            if (!indicator) return;
            
            indicator.className = 'status-indicator';
            if (status === 'online') {
                indicator.classList.add('online');
            } else if (status === 'offline') {
                indicator.classList.add('offline');
            } else if (status === 'creating') {
                indicator.classList.add('creating');
            }
        }

        function markServerActive(serverId) {
            serverBtns.forEach(btn => {
                const btnServer = parseInt(btn.dataset.server);
                if (btnServer === serverId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // ENVIAR MENSAGEM
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !isConnected) {
                if (!isConnected) showSystemMessage('⚠️ Aguarde a conexão...', false, true);
                return;
            }

            addMessageToDOM(currentUsername, text, true);
            messageHistory.push({ username: currentUsername, text, time: Date.now() });

            broadcastMessage({
                type: 'message',
                username: currentUsername,
                text: text,
                time: Date.now()
            });

            messageInput.value = '';
            messageInput.focus();
        }

        // ENVIAR ÁUDIO
        function sendAudio(audioData) {
            if (!isConnected) {
                showSystemMessage('⚠️ Aguarde a conexão...', false, true);
                return;
            }

            addMessageToDOM(currentUsername, '', true, false, false, false, audioData);
            messageHistory.push({ username: currentUsername, text: '🎤 Áudio', time: Date.now(), audio: audioData });

            broadcastMessage({
                type: 'audio',
                username: currentUsername,
                audio: audioData,
                time: Date.now()
            });
        }

        function broadcastMessage(data, excludeConn = null) {
            if (isServer) {
                Object.keys(clients).forEach(peerId => {
                    const conn = clients[peerId];
                    if (conn && conn !== excludeConn && conn.open) {
                        try {
                            conn.send(data);
                        } catch (e) {
                            console.warn('Erro ao enviar para', peerId, e);
                        }
                    }
                });
            } else if (serverConnection && serverConnection.open) {
                try {
                    serverConnection.send(data);
                } catch (e) {
                    console.warn('Erro ao enviar para servidor', e);
                }
            }
        }

        // ÁUDIO - GRAVAÇÃO
        async function startRecording() {
            if (isRecording) return;
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64Audio = reader.result;
                        sendAudio(base64Audio);
                    };
                    reader.readAsDataURL(audioBlob);
                    
                    // Limpar
                    audioChunks = [];
                    stream.getTracks().forEach(track => track.stop());
                    audioBtn.classList.remove('recording');
                    recordingTimer.textContent = '';
                    clearInterval(recordingTimerInterval);
                    isRecording = false;
                };
                
                mediaRecorder.start();
                isRecording = true;
                recordingStartTime = Date.now();
                audioBtn.classList.add('recording');
                
                // Timer
                let seconds = 0;
                recordingTimerInterval = setInterval(() => {
                    seconds++;
                    const remaining = 30 - seconds;
                    if (remaining <= 0) {
                        stopRecording();
                        return;
                    }
                    recordingTimer.textContent = `⏱️ ${remaining}s`;
                }, 1000);
                
                // Parar automaticamente após 30 segundos
                setTimeout(() => {
                    if (isRecording) {
                        stopRecording();
                    }
                }, 30000);
                
            } catch (err) {
                console.error('Erro ao acessar microfone:', err);
                showSystemMessage('⚠️ Erro ao acessar microfone. Verifique as permissões.', false, true);
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }
        }

        // INICIAR COMO SERVIDOR
        function startAsServer(serverId) {
            if (isServer && currentServer === serverId) return;
            
            cleanup();
            
            const serverInfo = SERVERS[serverId];
            if (!serverInfo) return;
            
            isServer = true;
            isConnected = true;
            currentServer = serverId;
            clients = {};
            isCreatingServer = false;
            
            updateStatus(`👑 Servidor (${serverInfo.name})`, 'online');
            showSystemMessage(`✅ Você é o servidor do ${serverInfo.name}!`, true);
            setInputEnabled(true);
            markServerActive(serverId);
            updateServerStatus(serverId, 'online');
            updateUserCount(0);
            
            peer = new Peer(serverInfo.id, {
                debug: 0,
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                console.log(`Servidor ${serverInfo.name} iniciado:`, id);
                showSystemMessage(`🟢 ${serverInfo.name} pronto!`, true);
            });

            peer.on('connection', (conn) => {
                console.log('Nova conexão:', conn.peer);
                clients[conn.peer] = conn;
                
                conn.on('open', () => {
                    showSystemMessage(`👤 ${conn.peer} entrou no chat`);
                    updateUserCount(Object.keys(clients).length);
                    
                    messageHistory.forEach(msg => {
                        conn.send({
                            type: 'history',
                            username: msg.username,
                            text: msg.text || '🎤 Áudio',
                            audio: msg.audio || null,
                            time: msg.time
                        });
                    });
                    
                    broadcastMessage({
                        type: 'system',
                        text: `${conn.peer} entrou no chat`
                    }, conn);
                });

                conn.on('data', (data) => {
                    if (data.type === 'message') {
                        messageHistory.push({ username: data.username, text: data.text, time: data.time });
                        addMessageToDOM(data.username, data.text, false);
                        broadcastMessage(data, conn);
                    } else if (data.type === 'audio') {
                        messageHistory.push({ username: data.username, text: '🎤 Áudio', time: data.time, audio: data.audio });
                        addMessageToDOM(data.username, '', false, false, false, false, data.audio);
                        broadcastMessage(data, conn);
                    } else if (data.type === 'join') {
                        showSystemMessage(`👤 ${data.username} entrou no chat`);
                        broadcastMessage({ type: 'system', text: `${data.username} entrou no chat` }, conn);
                    } else if (data.type === 'ping') {
                        conn.send({ type: 'pong' });
                    }
                });

                conn.on('close', () => {
                    delete clients[conn.peer];
                    showSystemMessage(`👤 ${conn.peer} saiu do chat`);
                    updateUserCount(Object.keys(clients).length);
                    broadcastMessage({
                        type: 'system',
                        text: `${conn.peer} saiu do chat`
                    });
                });

                conn.on('error', (err) => {
                    console.warn('Erro na conexão:', err);
                    delete clients[conn.peer];
                    updateUserCount(Object.keys(clients).length);
                });
            });

            peer.on('error', (err) => {
                console.error('Erro no servidor:', err);
                if (err.type === 'unavailable-id') {
                    showSystemMessage(`⚠️ ${serverInfo.name} já está ocupado. Conectando como cliente...`, false, true);
                    isServer = false;
                    isConnected = false;
                    cleanup();
                    setTimeout(() => connectAsClient(serverId), 1000);
                }
            });
        }

        // CONECTAR COMO CLIENTE
        function connectAsClient(serverId) {
            if (isServer && currentServer === serverId) return;
            
            cleanup();
            
            const serverInfo = SERVERS[serverId];
            if (!serverInfo) return;
            
            isServer = false;
            isConnected = false;
            currentServer = serverId;
            isCreatingServer = false;
            
            updateStatus(`Conectando a ${serverInfo.name}...`, 'connecting');
            showSystemMessage(`🔗 Tentando conectar ao ${serverInfo.name}...`);
            setInputEnabled(false);
            markServerActive(serverId);
            updateServerStatus(serverId, 'creating');
            
            peer = new Peer({
                debug: 0,
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                console.log('Cliente ID:', id);
                
                const conn = peer.connect(serverInfo.id, { reliable: true });
                serverConnection = conn;
                
                conn.on('open', () => {
                    isConnected = true;
                    updateStatus(`Conectado a ${serverInfo.name}`, 'online');
                    showSystemMessage(`✅ Conectado ao ${serverInfo.name}!`);
                    setInputEnabled(true);
                    markServerActive(serverId);
                    updateServerStatus(serverId, 'online');
                    
                    conn.send({
                        type: 'join',
                        username: currentUsername
                    });
                });

                conn.on('data', (data) => {
                    if (data.type === 'message') {
                        addMessageToDOM(data.username, data.text, false);
                        messageHistory.push({ username: data.username, text: data.text, time: data.time });
                    } else if (data.type === 'audio') {
                        addMessageToDOM(data.username, '', false, false, false, false, data.audio);
                        messageHistory.push({ username: data.username, text: '🎤 Áudio', time: data.time, audio: data.audio });
                    } else if (data.type === 'history') {
                        if (data.audio) {
                            addMessageToDOM(data.username, '', false, false, false, false, data.audio);
                            messageHistory.push({ username: data.username, text: '🎤 Áudio', time: data.time, audio: data.audio });
                        } else {
                            addMessageToDOM(data.username, data.text, false);
                            messageHistory.push({ username: data.username, text: data.text, time: data.time });
                        }
                    } else if (data.type === 'system') {
                        showSystemMessage(data.text);
                    } else if (data.type === 'pong') {
                        // Servidor está vivo
                    }
                });

                conn.on('close', () => {
                    isConnected = false;
                    serverConnection = null;
                    updateStatus(`Desconectado de ${serverInfo.name}`, 'offline');
                    showSystemMessage(`⚠️ Conexão com ${serverInfo.name} perdida!`, false, true);
                    setInputEnabled(false);
                    updateServerStatus(serverId, 'offline');
                    markServerActive(null);
                });

                conn.on('error', (err) => {
                    console.warn('Erro de conexão:', err);
                    if (err.type === 'peer-unavailable') {
                        showSystemMessage(`⚠️ ${serverInfo.name} não encontrado. Iniciando como servidor...`, false, true);
                        updateServerStatus(serverId, 'offline');
                        setTimeout(() => {
                            startAsServer(serverId);
                        }, 1000);
                    } else {
                        isConnected = false;
                        serverConnection = null;
                        updateStatus('Erro', 'offline');
                        setInputEnabled(false);
                        updateServerStatus(serverId, 'offline');
                    }
                });
            });

            peer.on('error', (err) => {
                console.error('Erro no cliente:', err);
                if (err.type === 'unavailable-id') {
                    cleanup();
                    setTimeout(() => connectAsClient(serverId), 1000);
                }
            });
        }

        // LIMPEZA
        function cleanup() {
            if (peer) {
                try {
                    peer.destroy();
                } catch (e) {}
                peer = null;
            }
            serverConnection = null;
            clients = {};
            
            if (isRecording) {
                stopRecording();
            }
        }

        // SELECIONAR SERVIDOR
        function selectServer(serverId) {
            if (serverId === currentServer && isConnected) {
                showSystemMessage(`ℹ️ Já conectado ao ${SERVERS[serverId].name}`);
                return;
            }
            
            // Limpa mensagens antigas
            messagesContainer.innerHTML = '';
            messageHistory = [];
            
            // Mostra mensagem de conexão
            const msg = document.createElement('div');
            msg.className = 'system-msg';
            msg.textContent = `🔌 Conectando ao ${SERVERS[serverId].name}...`;
            messagesContainer.appendChild(msg);
            
            // Tenta conectar como cliente primeiro
            connectAsClient(serverId);
            
            // Se não conectar em 5 segundos, tenta criar servidor
            setTimeout(() => {
                if (!isConnected && !isServer) {
                    startAsServer(serverId);
                }
            }, 5000);
        }

        // EVENT LISTENERS
        serverBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const serverId = parseInt(btn.dataset.server);
                selectServer(serverId);
            });
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        audioBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        // INICIALIZAR
        function init() {
            Object.keys(SERVERS).forEach(id => {
                updateServerStatus(parseInt(id), 'offline');
            });
            
            showSystemMessage('👆 Selecione um servidor para entrar');
            updateStatus('Selecione um servidor', 'offline');
        }

        // VERIFICAÇÃO DE SAÚDE
        setInterval(() => {
            if (!isServer && isConnected && serverConnection) {
                try {
                    serverConnection.send({ type: 'ping' });
                } catch (e) {
                    console.warn('Erro ao enviar ping:', e);
                }
            }
        }, 5000);

        // INICIA
        init();

        console.log('Servidores disponíveis:', SERVERS);
        console.log('Seu nome:', currentUsername);

    })();
</script>

</body>
</html>
