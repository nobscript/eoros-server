<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Server - Discord Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: #1e1e2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 95vh;
            max-height: 820px;
            background: #2b2d3e;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .chat-header {
            background: #1e1e2e;
            padding: 16px 20px;
            border-bottom: 1px solid #3a3c4e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header h1 {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header h1 span {
            background: #5865f2;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 30px;
            color: white;
            font-weight: 500;
        }

        .user-count {
            color: #a6a9c2;
            font-size: 14px;
            background: #2b2d3e;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #3a3c4e;
        }

        /* Messages Area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #232533;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #5865f2;
            border-radius: 10px;
        }

        .message {
            background: #2b2d3e;
            padding: 10px 14px;
            border-radius: 16px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
            border: 1px solid #3a3c4e;
            align-self: flex-start;
        }

        .message.own {
            align-self: flex-end;
            background: #5865f2;
            border-color: #5865f2;
        }

        .message .msg-user {
            font-size: 13px;
            font-weight: 600;
            color: #b9bbe7;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message.own .msg-user {
            color: #d4d6f0;
        }

        .message .msg-user .badge {
            background: #3a3c4e;
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 30px;
            color: #a6a9c2;
            font-weight: 400;
        }

        .message.own .msg-user .badge {
            background: #4752c4;
            color: #d4d6f0;
        }

        .message .msg-text {
            color: #e4e6f0;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message .msg-time {
            font-size: 10px;
            color: #6d6f87;
            margin-top: 4px;
            text-align: right;
        }

        .message.own .msg-time {
            color: #b9bbd4;
        }

        /* System message */
        .system-msg {
            text-align: center;
            font-size: 12px;
            color: #6d6f87;
            padding: 6px 0;
            background: transparent;
            border: none;
            align-self: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input Area */
        .input-area {
            background: #1e1e2e;
            padding: 12px 16px 16px;
            border-top: 1px solid #3a3c4e;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            background: #2b2d3e;
            border: 1px solid #3a3c4e;
            border-radius: 30px;
            padding: 12px 18px;
            color: #e4e6f0;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-area input:focus {
            border-color: #5865f2;
            background: #2f3145;
        }

        .input-area input::placeholder {
            color: #6d6f87;
        }

        .input-area button {
            background: #5865f2;
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .input-area button:active {
            transform: scale(0.92);
            background: #4752c4;
        }

        .input-area button:disabled {
            opacity: 0.5;
            transform: scale(1);
        }

        /* Status bar */
        .status-bar {
            background: #1e1e2e;
            padding: 6px 16px;
            font-size: 11px;
            color: #6d6f87;
            text-align: center;
            border-top: 1px solid #2b2d3e;
            display: flex;
            justify-content: space-between;
        }

        .status-bar .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .chat-container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
            .chat-header h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="chat-container" id="app">
    <!-- Header -->
    <div class="chat-header">
        <h1>
            💬 Chat
            <span>Beta</span>
        </h1>
        <div class="user-count" id="userCount">👥 0</div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messagesContainer">
        <div class="system-msg">🔌 Conectando ao servidor...</div>
    </div>

    <!-- Input -->
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Digite sua mensagem..." maxlength="500" autocomplete="off">
        <button id="sendBtn" aria-label="Enviar">➤</button>
    </div>

    <!-- Status -->
    <div class="status-bar">
        <span><span class="status-dot"></span> Online</span>
        <span id="connectionStatus">Conectado</span>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // --- CONFIGURAÇÃO ---
        // Use seu próprio ID do canal do PeerJS (ou deixe o aleatório)
        // IMPORTANTE: todos os usuários devem usar o MESMO ID para se conectar ao mesmo "servidor"
        const CHANNEL_ID = 'discord-mobile-chat-server';  // <-- MUDE PARA UM ID ÚNICO SE QUISER

        // --- ELEMENTOS ---
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const userCountSpan = document.getElementById('userCount');
        const connectionStatusSpan = document.getElementById('connectionStatus');

        // --- ESTADO ---
        let currentUsername = 'Anônimo';
        let peer = null;
        let conn = null;          // conexão ativa com o servidor (ou peer)
        let isConnected = false;
        let messageHistory = [];  // armazena mensagens para evitar perder

        // --- FUNÇÕES AUXILIARES ---

        // Gera um nome aleatório (para demonstração)
        function generateRandomName() {
            const names = ['Fênix', 'Luna', 'Nyx', 'Kai', 'Rex', 'Mia', 'Zion', 'Aria', 'Noah', 'Iris'];
            const suffix = Math.floor(Math.random() * 900 + 100);
            return names[Math.floor(Math.random() * names.length)] + suffix;
        }

        // Formata hora atual
        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        // Adiciona uma mensagem ao DOM
        function addMessageToDOM(username, text, isOwn = false, system = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message' + (isOwn ? ' own' : '');

            if (system) {
                msgDiv.className = 'system-msg';
                msgDiv.textContent = text;
                messagesContainer.appendChild(msgDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                return;
            }

            const userDiv = document.createElement('div');
            userDiv.className = 'msg-user';
            userDiv.innerHTML = `${username} <span class="badge">${isOwn ? 'Você' : 'Online'}</span>`;

            const textDiv = document.createElement('div');
            textDiv.className = 'msg-text';
            textDiv.textContent = text;

            const timeDiv = document.createElement('div');
            timeDiv.className = 'msg-time';
            timeDiv.textContent = getCurrentTime();

            msgDiv.appendChild(userDiv);
            msgDiv.appendChild(textDiv);
            msgDiv.appendChild(timeDiv);

            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Mostra mensagem de sistema
        function showSystemMessage(text) {
            addMessageToDOM('', text, false, true);
        }

        // Atualiza contador de usuários (simulado - não temos como saber exato via peerjs)
        function updateUserCount(count) {
            userCountSpan.textContent = `👥 ${count || '?'}`;
        }

        // --- ENVIAR MENSAGEM ---
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !isConnected || !conn) {
                if (!isConnected) showSystemMessage('⚠️ Desconectado. Reconectando...');
                return;
            }

            // Adiciona localmente
            addMessageToDOM(currentUsername, text, true);
            messageHistory.push({ username: currentUsername, text, time: Date.now() });

            // Envia para todos os peers conectados
            try {
                conn.send({
                    type: 'message',
                    username: currentUsername,
                    text: text,
                    time: Date.now()
                });
            } catch (e) {
                console.warn('Erro ao enviar:', e);
                showSystemMessage('❌ Falha ao enviar mensagem.');
            }

            messageInput.value = '';
            messageInput.focus();
        }

        // --- INICIALIZAÇÃO DO PEER ---
        function initPeer() {
            // Gera um nome aleatório para esta sessão
            currentUsername = generateRandomName();

            // Cria um novo peer com ID fixo (servidor) - ou aleatório se for cliente
            // Na prática, todos usam o mesmo ID para "se encontrar"
            // Mas apenas um peer pode ter um ID fixo, os outros precisam de IDs aleatórios
            // Para simplicidade, vamos usar o mesmo ID para todos - mas o PeerJS permite múltiplas conexões?
            // Na verdade, o PeerJS não permite que dois peers com o mesmo ID coexistam.
            // Então a estratégia correta: um peer "server" com ID fixo, e outros se conectam a ele.
            // Mas como o GitHub Pages é estático, todos são "clientes" que se conectam a um servidor externo?
            // Solução: usar um servidor PeerJS público (0.peerjs.com) e um ID fixo para o "servidor".
            // O primeiro a se conectar com o ID fixo será o "servidor", os outros serão clientes.
            // Vamos fazer isso: todo mundo tenta se conectar ao ID fixo. Se falhar, cria um peer aleatório e espera.
            // Mas precisamos de um "servidor" que escute conexões.

            // Abordagem: cada peer tenta se conectar ao CHANNEL_ID. Se não conseguir, cria um peer aleatório e escuta.
            // Mas para isso, precisamos que um peer "servidor" esteja online com o CHANNEL_ID.
            // Como não temos um servidor dedicado, a primeira pessoa que abrir a página será o "servidor"
            // e as outras se conectarão a ela.
            // Isso é frágil, mas funciona para demonstração.

            // Vamos tentar nos conectar ao servidor (CHANNEL_ID)
            // Se falhar, criamos um peer servidor.

            // Primeiro, tenta se conectar ao servidor existente
            tryConnectToServer();

            // Também escutamos conexões recebidas (caso sejamos o servidor)
            listenForConnections();
        }

        let isServer = false;

        function tryConnectToServer() {
            if (peer) return;

            peer = new Peer(undefined, {  // ID aleatório
                debug: 0,
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                console.log('Meu ID:', id);
                connectionStatusSpan.textContent = 'Conectando...';
                showSystemMessage(`🔗 Seu ID: ${id}`);

                // Tenta conectar ao servidor central
                const serverPeerId = CHANNEL_ID;
                conn = peer.connect(serverPeerId, { reliable: true });

                conn.on('open', () => {
                    isConnected = true;
                    isServer = false;
                    connectionStatusSpan.textContent = 'Conectado ao servidor';
                    showSystemMessage('✅ Conectado ao servidor!');
                    updateUserCount('?');
                    // Envia apresentação
                    conn.send({
                        type: 'join',
                        username: currentUsername,
                        time: Date.now()
                    });
                });

                conn.on('data', (data) => {
                    handleIncomingData(data);
                });

                conn.on('close', () => {
                    isConnected = false;
                    connectionStatusSpan.textContent = 'Desconectado';
                    showSystemMessage('⚠️ Desconectado do servidor. Tentando reconectar...');
                    setTimeout(() => {
                        reconnect();
                    }, 3000);
                });

                conn.on('error', (err) => {
                    console.warn('Erro na conexão:', err);
                    // Se falhar ao conectar, talvez sejamos o servidor
                    if (err.type === 'peer-unavailable') {
                        becomeServer();
                    } else {
                        connectionStatusSpan.textContent = 'Erro';
                        showSystemMessage(`❌ Erro: ${err.message}`);
                    }
                });
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                if (err.type === 'unavailable-id') {
                    // Se o ID já está em uso, tenta novamente com outro ID
                    becomeServer();
                }
            });
        }

        function becomeServer() {
            if (isServer) return;
            isServer = true;
            connectionStatusSpan.textContent = 'Servidor ativo';
            showSystemMessage('🌟 Você é o servidor! Aguarde conexões...');

            // Fecha peer anterior se existir
            if (peer) {
                peer.destroy();
                peer = null;
            }

            // Cria um novo peer com o ID fixo (servidor)
            peer = new Peer(CHANNEL_ID, {
                debug: 0,
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                console.log('Servidor iniciado com ID:', id);
                connectionStatusSpan.textContent = 'Servidor ativo';
                showSystemMessage('✅ Servidor pronto! Compartilhe o ID: ' + CHANNEL_ID);
                updateUserCount(0);
                // Escuta conexões
                listenForConnections();
            });

            peer.on('error', (err) => {
                console.error('Erro no servidor:', err);
                if (err.type === 'unavailable-id') {
                    // Se o ID já está em uso, significa que outro servidor está ativo
                    showSystemMessage('⚠️ Outro servidor já está ativo. Conectando como cliente...');
                    isServer = false;
                    // Tenta conectar como cliente novamente
                    setTimeout(() => {
                        peer.destroy();
                        peer = null;
                        tryConnectToServer();
                    }, 2000);
                }
            });

            // Escuta conexões
            peer.on('connection', (incomingConn) => {
                console.log('Nova conexão recebida!');
                // Aceita a conexão
                incomingConn.on('open', () => {
                    showSystemMessage(`👤 Novo usuário conectado!`);
                    updateUserCount(peer.connections[CHANNEL_ID] ? Object.keys(peer.connections[CHANNEL_ID]).length : 0);
                    // Envia histórico para o novo usuário
                    messageHistory.forEach(msg => {
                        incomingConn.send({
                            type: 'history',
                            username: msg.username,
                            text: msg.text,
                            time: msg.time
                        });
                    });
                });

                incomingConn.on('data', (data) => {
                    // Encaminha para todos os outros clientes
                    if (data.type === 'message') {
                        // Adiciona ao histórico
                        messageHistory.push({ username: data.username, text: data.text, time: data.time });
                        // Envia para todos os conectados (exceto o remetente)
                        broadcastMessage(data, incomingConn);
                        // Mostra localmente
                        addMessageToDOM(data.username, data.text, false);
                    } else if (data.type === 'join') {
                        showSystemMessage(`👤 ${data.username} entrou no chat`);
                        // Anuncia para todos
                        broadcastMessage({ type: 'system', text: `${data.username} entrou no chat` }, incomingConn);
                    }
                });

                incomingConn.on('close', () => {
                    showSystemMessage(`👤 Um usuário saiu`);
                    updateUserCount(peer.connections[CHANNEL_ID] ? Object.keys(peer.connections[CHANNEL_ID]).length : 0);
                });
            });
        }

        function listenForConnections() {
            if (!peer) return;
            // Já escutamos via peer.on('connection') acima
        }

        function handleIncomingData(data) {
            if (data.type === 'message') {
                addMessageToDOM(data.username, data.text, false);
                // Adiciona ao histórico local
                messageHistory.push({ username: data.username, text: data.text, time: data.time });
            } else if (data.type === 'history') {
                // Recebe histórico do servidor
                addMessageToDOM(data.username, data.text, false);
                messageHistory.push({ username: data.username, text: data.text, time: data.time });
            } else if (data.type === 'system') {
                showSystemMessage(data.text);
            } else if (data.type === 'join') {
                // Não faz nada
            }
        }

        function broadcastMessage(data, senderConn) {
            if (!peer) return;
            const connections = peer.connections[CHANNEL_ID] || {};
            Object.keys(connections).forEach(key => {
                const c = connections[key];
                if (c !== senderConn && c.open) {
                    c.send(data);
                }
            });
        }

        function reconnect() {
            if (peer) {
                peer.destroy();
                peer = null;
            }
            isConnected = false;
            isServer = false;
            setTimeout(() => {
                initPeer();
            }, 500);
        }

        // --- EVENT LISTENERS ---
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // Limpa mensagem de sistema inicial
        setTimeout(() => {
            const sysMsg = document.querySelector('.system-msg');
            if (sysMsg && sysMsg.textContent.includes('Conectando')) {
                sysMsg.remove();
            }
        }, 2000);

        // --- INICIA ---
        initPeer();

        // Atualiza contador periodicamente (se for servidor)
        setInterval(() => {
            if (isServer && peer) {
                const conns = peer.connections[CHANNEL_ID] || {};
                const count = Object.keys(conns).length;
                updateUserCount(count);
            }
        }, 5000);

        // Fallback: se não conectar em 10 segundos, tenta ser servidor
        setTimeout(() => {
            if (!isConnected && !isServer) {
                showSystemMessage('⏳ Tentando estabelecer conexão...');
                becomeServer();
            }
        }, 10000);

    })();
</script>

</body>
</html>
