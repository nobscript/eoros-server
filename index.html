<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Server - Discord Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: #1e1e2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 95vh;
            max-height: 820px;
            background: #2b2d3e;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            background: #1e1e2e;
            padding: 16px 20px;
            border-bottom: 1px solid #3a3c4e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header h1 {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header h1 span {
            background: #5865f2;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 30px;
            color: white;
            font-weight: 500;
        }

        .user-count {
            color: #a6a9c2;
            font-size: 14px;
            background: #2b2d3e;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #3a3c4e;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #232533;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #5865f2;
            border-radius: 10px;
        }

        .message {
            background: #2b2d3e;
            padding: 10px 14px;
            border-radius: 16px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
            border: 1px solid #3a3c4e;
            align-self: flex-start;
        }

        .message.own {
            align-self: flex-end;
            background: #5865f2;
            border-color: #5865f2;
        }

        .message .msg-user {
            font-size: 13px;
            font-weight: 600;
            color: #b9bbe7;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message.own .msg-user {
            color: #d4d6f0;
        }

        .message .msg-user .badge {
            background: #3a3c4e;
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 30px;
            color: #a6a9c2;
            font-weight: 400;
        }

        .message.own .msg-user .badge {
            background: #4752c4;
            color: #d4d6f0;
        }

        .message .msg-text {
            color: #e4e6f0;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message .msg-time {
            font-size: 10px;
            color: #6d6f87;
            margin-top: 4px;
            text-align: right;
        }

        .message.own .msg-time {
            color: #b9bbd4;
        }

        .system-msg {
            text-align: center;
            font-size: 12px;
            color: #6d6f87;
            padding: 6px 0;
            background: transparent;
            border: none;
            align-self: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            background: #1e1e2e;
            padding: 12px 16px 16px;
            border-top: 1px solid #3a3c4e;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            background: #2b2d3e;
            border: 1px solid #3a3c4e;
            border-radius: 30px;
            padding: 12px 18px;
            color: #e4e6f0;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-area input:focus {
            border-color: #5865f2;
            background: #2f3145;
        }

        .input-area input::placeholder {
            color: #6d6f87;
        }

        .input-area button {
            background: #5865f2;
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .input-area button:active {
            transform: scale(0.92);
            background: #4752c4;
        }

        .input-area button:disabled {
            opacity: 0.5;
            transform: scale(1);
        }

        .status-bar {
            background: #1e1e2e;
            padding: 6px 16px;
            font-size: 11px;
            color: #6d6f87;
            text-align: center;
            border-top: 1px solid #2b2d3e;
            display: flex;
            justify-content: space-between;
        }

        .status-bar .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        @media (max-width: 480px) {
            .chat-container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
            .chat-header h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="chat-container" id="app">
    <div class="chat-header">
        <h1>
            💬 Chat
            <span>Beta</span>
        </h1>
        <div class="user-count" id="userCount">👥 0</div>
    </div>

    <div class="messages" id="messagesContainer">
        <div class="system-msg">🔄 Iniciando servidor...</div>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Digite sua mensagem..." maxlength="500" autocomplete="off">
        <button id="sendBtn" aria-label="Enviar">➤</button>
    </div>

    <div class="status-bar">
        <span><span class="status-dot"></span> Online</span>
        <span id="connectionStatus">Iniciando...</span>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script>
    (function() {
        'use strict';

        // ID fixo do servidor - mude para algo único
        const SERVER_ID = 'discord-chat-server-' + Math.random().toString(36).substring(2, 8);
        
        // Elementos
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const userCountSpan = document.getElementById('userCount');
        const connectionStatusSpan = document.getElementById('connectionStatus');

        // Estado
        let currentUsername = 'Usuário' + Math.floor(Math.random() * 1000);
        let peer = null;
        let connections = {};
        let isServer = false;
        let messageHistory = [];
        let isConnected = false;

        // Funções auxiliares
        function getCurrentTime() {
            return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function addMessageToDOM(username, text, isOwn = false, system = false) {
            const msgDiv = document.createElement('div');
            
            if (system) {
                msgDiv.className = 'system-msg';
                msgDiv.textContent = text;
            } else {
                msgDiv.className = 'message' + (isOwn ? ' own' : '');
                
                const userDiv = document.createElement('div');
                userDiv.className = 'msg-user';
                userDiv.innerHTML = `${username} <span class="badge">${isOwn ? 'Você' : 'Online'}</span>`;
                
                const textDiv = document.createElement('div');
                textDiv.className = 'msg-text';
                textDiv.textContent = text;
                
                const timeDiv = document.createElement('div');
                timeDiv.className = 'msg-time';
                timeDiv.textContent = getCurrentTime();
                
                msgDiv.appendChild(userDiv);
                msgDiv.appendChild(textDiv);
                msgDiv.appendChild(timeDiv);
            }
            
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showSystemMessage(text) {
            addMessageToDOM('', text, false, true);
        }

        function updateUserCount(count) {
            userCountSpan.textContent = `👥 ${count || 0}`;
        }

        // Enviar mensagem
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !isConnected) {
                if (!isConnected) showSystemMessage('⚠️ Aguarde a conexão...');
                return;
            }

            addMessageToDOM(currentUsername, text, true);
            messageHistory.push({ username: currentUsername, text, time: Date.now() });

            // Envia para todos os conectados
            broadcastMessage({
                type: 'message',
                username: currentUsername,
                text: text,
                time: Date.now()
            });

            messageInput.value = '';
            messageInput.focus();
        }

        // Transmitir mensagem para todos
        function broadcastMessage(data, senderConn = null) {
            const conns = isServer ? connections : (peer ? peer.connections : {});
            
            Object.keys(conns).forEach(key => {
                const conn = conns[key];
                if (conn && conn !== senderConn && conn.open) {
                    try {
                        conn.send(data);
                    } catch (e) {
                        console.warn('Erro ao enviar:', e);
                    }
                }
            });
        }

        // Inicializar como servidor
        function initServer() {
            isServer = true;
            connectionStatusSpan.textContent = 'Servidor ativo';
            showSystemMessage(`✅ Servidor criado! ID: ${SERVER_ID}`);
            
            peer = new Peer(SERVER_ID, {
                debug: 0,
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                console.log('Servidor iniciado:', id);
                updateUserCount(0);
            });

            peer.on('connection', (conn) => {
                console.log('Nova conexão:', conn.peer);
                connections[conn.peer] = conn;
                
                conn.on('open', () => {
                    showSystemMessage(`👤 ${conn.peer} entrou no chat`);
                    updateUserCount(Object.keys(connections).length);
                    
                    // Envia histórico para o novo usuário
                    messageHistory.forEach(msg => {
                        conn.send({
                            type: 'history',
                            username: msg.username,
                            text: msg.text,
                            time: msg.time
                        });
                    });
                });

                conn.on('data', (data) => {
                    if (data.type === 'message') {
                        messageHistory.push({ username: data.username, text: data.text, time: data.time });
                        addMessageToDOM(data.username, data.text, false);
                        broadcastMessage(data, conn);
                    } else if (data.type === 'join') {
                        showSystemMessage(`👤 ${data.username} entrou no chat`);
                        broadcastMessage({ type: 'system', text: `${data.username} entrou no chat` }, conn);
                    }
                });

                conn.on('close', () => {
                    delete connections[conn.peer];
                    showSystemMessage(`👤 ${conn.peer} saiu do chat`);
                    updateUserCount(Object.keys(connections).length);
                });
            });

            peer.on('error', (err) => {
                console.error('Erro no servidor:', err);
                if (err.type === 'unavailable-id') {
                    showSystemMessage('⚠️ ID já em uso. Tentando como cliente...');
                    setTimeout(() => {
                        peer.destroy();
                        peer = null;
                        initClient();
                    }, 1000);
                }
            });

            isConnected = true;
        }

        // Inicializar como cliente
        function initClient() {
            isServer = false;
            connectionStatusSpan.textContent = 'Conectando...';
            showSystemMessage(`🔗 Conectando ao servidor: ${SERVER_ID}`);
            
            peer = new Peer({
                debug: 0,
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                console.log('Cliente ID:', id);
                const conn = peer.connect(SERVER_ID, { reliable: true });
                
                conn.on('open', () => {
                    isConnected = true;
                    connectionStatusSpan.textContent = 'Conectado';
                    showSystemMessage('✅ Conectado ao servidor!');
                    
                    conn.send({
                        type: 'join',
                        username: currentUsername
                    });
                });

                conn.on('data', (data) => {
                    if (data.type === 'message') {
                        addMessageToDOM(data.username, data.text, false);
                        messageHistory.push({ username: data.username, text: data.text, time: data.time });
                    } else if (data.type === 'history') {
                        addMessageToDOM(data.username, data.text, false);
                        messageHistory.push({ username: data.username, text: data.text, time: data.time });
                    } else if (data.type === 'system') {
                        showSystemMessage(data.text);
                    }
                });

                conn.on('close', () => {
                    isConnected = false;
                    connectionStatusSpan.textContent = 'Desconectado';
                    showSystemMessage('⚠️ Desconectado. Tentando reconectar...');
                    setTimeout(() => {
                        if (!isConnected) {
                            peer.destroy();
                            peer = null;
                            initClient();
                        }
                    }, 3000);
                });

                conn.on('error', (err) => {
                    console.warn('Erro de conexão:', err);
                    if (err.type === 'peer-unavailable') {
                        showSystemMessage('⚠️ Servidor não encontrado. Iniciando como servidor...');
                        setTimeout(() => {
                            peer.destroy();
                            peer = null;
                            initServer();
                        }, 1000);
                    }
                });
            });

            peer.on('error', (err) => {
                console.error('Erro no cliente:', err);
                if (err.type === 'unavailable-id') {
                    // Tenta novamente com outro ID
                    peer.destroy();
                    peer = null;
                    setTimeout(() => initClient(), 500);
                }
            });
        }

        // Inicializar
        function init() {
            // Limpa mensagem inicial
            setTimeout(() => {
                const sysMsg = document.querySelector('.system-msg');
                if (sysMsg) sysMsg.remove();
            }, 1000);

            // Primeiro tenta conectar como cliente
            initClient();

            // Se não conectar em 5 segundos, tenta ser servidor
            setTimeout(() => {
                if (!isConnected && !isServer) {
                    showSystemMessage('⏳ Tentando iniciar servidor...');
                    if (peer) {
                        peer.destroy();
                        peer = null;
                    }
                    initServer();
                }
            }, 5000);
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // Inicia
        init();

        // Atualiza contador periodicamente
        setInterval(() => {
            if (isServer) {
                updateUserCount(Object.keys(connections).length);
            }
        }, 3000);

    })();
</script>

</body>
</html>
